[project]
name = "k8s-airflow-data-platform"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line length (handled by formatter)
    "SIM108", # ternary operator (readability)
]

[tool.ruff.lint.per-file-ignores]
"dags/*" = ["F401"]              # re-exports / Airflow DAG pattern
"dashboard/*" = ["E402"]         # streamlit requires set_page_config before other imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
