name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Fast lint + unit tests (~30 s) ─────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest psycopg2-binary

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Compile DAG (syntax check)
        run: python -m py_compile dags/pipeline_dag.py
        env:
          # Make shared/ importable for the DAG's top-level imports
          PYTHONPATH: .

      - name: Unit tests
        run: pytest tests/ -v

  # ─── Job 2: kind smoke test (~8–12 min) ────────────────────────────
  smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-test            # only run if lint passes
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          cluster_name: data-platform
          wait: 120s

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Create namespace
        run: kubectl apply -f manifests/namespace.yaml

      - name: Install Airflow
        run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update
          helm install airflow apache-airflow/airflow \
            --namespace data-platform \
            --set executor=LocalExecutor \
            --timeout 10m

      - name: Wait for pods
        run: |
          echo "Waiting for all pods to be ready..."
          kubectl wait --for=condition=ready pod \
            --all -n data-platform \
            --timeout=300s
          kubectl get pods -n data-platform

      - name: Copy DAG + shared to scheduler
        run: |
          SCHEDULER=$(kubectl get pods -n data-platform \
            -l component=scheduler -o jsonpath='{.items[0].metadata.name}')

          echo "Copying to $SCHEDULER (scheduler container)..."
          kubectl cp dags/pipeline_dag.py data-platform/$SCHEDULER:/opt/airflow/dags/pipeline_dag.py -c scheduler
          kubectl cp shared/              data-platform/$SCHEDULER:/opt/airflow/dags/shared/         -c scheduler

          # Install psycopg2-binary in scheduler (for the load task)
          kubectl exec $SCHEDULER -c scheduler -n data-platform -- \
            pip install --quiet psycopg2-binary

          # Verify files landed
          echo "--- Files in scheduler ---"
          kubectl exec $SCHEDULER -c scheduler -n data-platform -- ls -R /opt/airflow/dags/

      - name: Run DAG end-to-end (airflow dags test)
        run: |
          SCHEDULER=$(kubectl get pods -n data-platform \
            -l component=scheduler -o jsonpath='{.items[0].metadata.name}')

          # `airflow dags test` loads DAGs directly from the filesystem,
          # runs all tasks synchronously, and exits non-zero on failure.
          # This bypasses the dag-processor entirely — perfect for CI.
          echo "Running full DAG test..."
          kubectl exec $SCHEDULER -c scheduler -n data-platform -- \
            airflow dags test multicloud_pipeline_local 2026-06-18 2>&1 | tee /tmp/dag-test-output.txt

          echo "✅ DAG test completed successfully!"

      - name: Verify data in PostgreSQL
        run: |
          ROW_COUNT=$(kubectl exec airflow-postgresql-0 -n data-platform -- \
            env PGPASSWORD=postgres psql -U postgres -t -c \
            "SELECT count(*) FROM weather_observations;" 2>/dev/null | tr -d ' ')

          echo "Rows in weather_observations: $ROW_COUNT"

          if [ "$ROW_COUNT" -gt 0 ] 2>/dev/null; then
            echo "✅ Data landed successfully!"
            kubectl exec airflow-postgresql-0 -n data-platform -- \
              env PGPASSWORD=postgres psql -U postgres -c \
              "SELECT id, ingested_at, temperature_c, wind_speed_kmh, humidity_pct
               FROM weather_observations ORDER BY ingested_at DESC LIMIT 5;"
          else
            echo "❌ No data found in weather_observations"
            exit 1
          fi

      - name: Build dashboard image
        run: docker build -t pipeline-dashboard:latest dashboard/

      - name: Load dashboard into kind & deploy
        run: |
          kind load docker-image pipeline-dashboard:latest --name data-platform
          kubectl apply -f manifests/dashboard.yaml
          kubectl wait --for=condition=ready pod \
            -l app=dashboard -n data-platform \
            --timeout=120s
          echo "✅ Dashboard pod is running!"

      - name: Dump debug info on failure
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -n data-platform
          echo ""
          echo "=== Events ==="
          kubectl get events -n data-platform --sort-by='.lastTimestamp' | tail -30
          echo ""
          echo "=== Scheduler logs (last 50 lines) ==="
          kubectl logs sts/airflow-scheduler -c scheduler -n data-platform --tail=50 || true
          echo ""
          echo "=== DAG processor logs (last 50 lines) ==="
          kubectl logs deploy/airflow-dag-processor -c dag-processor -n data-platform --tail=50 || true
